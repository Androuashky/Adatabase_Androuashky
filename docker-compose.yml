services:
  db:
    image: postgres:16
    container_name: adatabase-db
    environment:
      POSTGRES_USER: adatabase
      POSTGRES_PASSWORD: adatabase
      POSTGRES_DB: adatabase
    ports:
      - "5450:5432"
    volumes:
      - ./adatabase.sql:/docker-entrypoint-initdb.d/01-adatabase.sql
      - adatabase-data:/var/lib/postgresql/data

volumes:
  adatabase-data:



